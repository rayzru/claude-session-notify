name: Release

# Push a tag naming the extension and the version in extension/package.json
# (claude-session-notify@0.2.0) to cut a release:
# the Claude Code plugin in this repository has versions of its own.
# The extension is built for macOS — Apple silicon and Intel, both carrying the same universal
# notifying app — and for Linux, where it runs as the remote side of a VS Code window; the
# Marketplace offers a package only on its platform. The bridge, the remote window's half on
# the user's Mac, is built for macOS alone. They go to a GitHub release and to Open VSX; the
# VS Code Marketplace takes the same files by hand, uploaded from the release page.
on:
  push:
    tags: ['claude-session-notify@*']

permissions:
  contents: write # the GitHub release
  id-token: write # Open VSX trusted publishing: no stored token

jobs:
  release:
    runs-on: macos-latest # the notifying app is compiled with Swift
    # The Marketplace identity trusts this environment, not a tag: a tag credential matches one tag.
    environment: marketplace
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vsce 4 needs it
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - name: The tag names the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "claude-session-notify@$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but extension/package.json says $version"
            exit 1
          fi
          if [ "$(node -p "require('./bridge/package.json').version")" != "$version" ]; then
            echo "::error::extension/bridge/package.json is not at $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package for macOS and Linux, and the bridge for macOS
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            vsix="claude-session-notify-$VERSION-$target.vsix"
            npm run package -- --target "$target" --out "$vsix"
          done
          for target in darwin-arm64 darwin-x64; do
            vsix="claude-session-notify-bridge-$VERSION-$target.vsix"
            npm run package:bridge -- --target "$target" --out "../$vsix"
            # Without the app a Mac would fall back to banners nobody can click.
            unzip -l "claude-session-notify-$VERSION-$target.vsix" | grep -q 'notify-helper/Contents/MacOS/notify'
            unzip -l "$vsix" | grep -q 'notify-helper/Contents/MacOS/notify'
          done
      # Re-running a failed job must not trip over a release it already made.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v head="## $VERSION" '$0 == head { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" claude-session-notify-*"$VERSION"-*.vsix --clobber
      # Open VSX trusts this workflow once the namespace owner has registered it (RELEASING.md);
      # the repository variable says that has happened. An OVSX_PAT secret is the fallback,
      # also when trusted publishing is refused. Neither: say so on the run, rather than leave
      # Open VSX a version behind unnoticed.
      - name: Open VSX
        env:
          TRUSTED: ${{ vars.OPEN_VSX_TRUSTED }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          packages=(claude-session-notify-*"$VERSION"-*.vsix)
          if [ "$TRUSTED" = true ] && npx ovsx publish --packagePath "${packages[@]}" --skip-duplicate --trusted-publishing; then
            exit 0
          fi
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish --packagePath "${packages[@]}" --skip-duplicate
          elif [ "$TRUSTED" = true ]; then
            exit 1
          else
            echo "::warning title=Open VSX skipped::not published to Open VSX — set OPEN_VSX_TRUSTED or the OVSX_PAT secret (RELEASING.md)"
          fi
      # The VS Code Marketplace takes no stored token either: a managed identity in Microsoft
      # Entra ID trusts this workflow's environment, and is a Contributor of the publisher
      # (RELEASING.md). Until that is set up, the packages go up by hand.
      - name: Sign in to Microsoft Entra ID
        if: vars.MARKETPLACE_ENTRA == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: VS Code Marketplace
        env:
          ENTRA: ${{ vars.MARKETPLACE_ENTRA }}
        run: |
          if [ "$ENTRA" != true ]; then
            echo "::warning title=Marketplace skipped::not published to the VS Code Marketplace — upload the packages from the release by hand, or set up publishing (RELEASING.md)"
            exit 0
          fi
          npx vsce publish --azure-credential --skip-duplicate --packagePath claude-session-notify-"$VERSION"-*.vsix
          npx vsce publish --azure-credential --skip-duplicate --packagePath claude-session-notify-bridge-"$VERSION"-*.vsix
