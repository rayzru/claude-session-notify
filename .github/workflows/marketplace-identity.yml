name: Marketplace identity

# One-time setup (RELEASING.md): prints the id under which the publisher knows the release
# workflow's managed identity. The Members page of the publisher takes only this id — not the
# client, object or resource id. Run it from the Actions tab after the federated credential exists.
on: workflow_dispatch

permissions:
  id-token: write

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # 499b84ac-… is Azure DevOps' own application id, the same everywhere.
      - name: The id to add on the publisher's Members page
        run: |
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "::notice title=Marketplace member id::$id"
